[workspace]
resolver = "2"
members = [
    "crates/twin-core",
    "crates/twin-wasm",
    "crates/twin-pipeline",
    "crates/twin-bench",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
twin-core = { path = "crates/twin-core" }
bytemuck = { version = "1.19", features = ["derive"] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
